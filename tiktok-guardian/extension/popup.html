<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, sans-serif; width: 220px; padding: 12px; margin: 0; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #333; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #999; flex-shrink: 0; }
    .dot.connected { background: #2ecc71; }
    .dot.disconnected { background: #e74c3c; }
  </style>
</head>
<body>
  <h1>TikTok Tab Guardian</h1>
  <div class="status">
    <div id="dot" class="dot"></div>
    <span id="label">Checking...</span>
  </div>
  <script src="popup.js"></script>
</body>
</html>
